# app.evolako.rs (Moj Evolako): every commit to main is checked, built and deployed to the Cloudflare Pages project
# "evolako-app" (production). Secrets (repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  — a token with "Account · Cloudflare Pages · Edit" only
#   CLOUDFLARE_ACCOUNT_ID — the account id from the Cloudflare dashboard
# The live runtime config is deploy/config.production.json (public values only: the publishable key and the Google
# client id go to every browser anyway — never a sb_secret_… key). public/config.json stays the demo config for tests.
# Security (26.10.2026): actions are pinned to commit hashes and wrangler to an exact version, so a hijacked tag or
# a poisoned npm release cannot reach the Cloudflare token. To update: take a release at least a week old
# (npm view wrangler time; git ls-remote --tags https://github.com/actions/<name>) and change the pins here.
# A commit whose message contains [skip deploy] is not deployed. Manual run: Actions → Deploy → Run workflow.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-evolako-app
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'   # wrangler 4.151+ needs Node 22 (it refuses to start on Node 20)
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check (strings, types, unit tests)
        run: |
          npm run strings:check
          npm run typecheck
          npm test
      - name: Build
        run: npx vite build
      - name: Production config and sanity checks
        run: |
          cp deploy/config.production.json dist/config.json
          node -e "const c=require('./dist/config.json'); if(!c.apiBase||!c.publishableKey||!String(c.publishableKey).startsWith('sb_publishable_')) {console.error('bad config.json'); process.exit(1)}"
          if grep -rq "sb_secret_" dist; then echo "secret key in dist"; exit 1; fi
          for f in index.html sw.js boot.js robots.txt _headers _redirects manifest.webmanifest .well-known/assetlinks.json posta/index.json; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          node -e "for (const i of require('./dist/posta/index.json').issues) { require('fs').accessSync('dist/posta/'+i.slug+'.json') }"
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.151.0 pages deploy dist --project-name=evolako-app --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s | cut -c1-300)" --commit-dirty=true
